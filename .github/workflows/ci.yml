
name: ML Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "ml-service/**"
      - ".github/workflows/ci.yml"
      - "docker-compose.yml"

  push:
    branches:
      - main
    paths:
      - "ml-service/**"
      - ".github/workflows/ci.yml"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run ML Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -u -m pip install --progress-bar off --verbose -r requirements.txt
        timeout-minutes: 5

      - name: Diagnose Python imports
        run: |
          python -u -c "print('Testing torch...', flush=True); import torch; print('torch OK:', torch.__version__, flush=True)"
          python -u -c "print('Testing torchvision...', flush=True); import torchvision; print('torchvision OK:', torchvision.__version__, flush=True)"
          python -u -c "print('Testing FastAPI app...', flush=True); import app; print('app import OK', flush=True)"

      - name: Run automated tests
        run: python -m pytest -v

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: false
          load: true
          tags: digit-recognition-ml:ci

      - name: Run container
        run: |
          docker run -d \
            --name digit-recognition-api \
            -p 8000:8000 \
            digit-recognition-ml:ci

      - name: Check API health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health \
              --output health-response.json; then
              cat health-response.json
              python -c "import json; assert json.load(open('health-response.json')) == {'status': 'ok'}"
              exit 0
            fi
            echo "Waiting for API to start... ($attempt/30)"
            sleep 2
          done

          echo "API health check failed."
          docker logs digit-recognition-api
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs digit-recognition-api

      - name: Stop container
        if: always()
        run: docker rm -f digit-recognition-api || true

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
